name: Codeflash Agent

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          path: target
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout codeflash-agent
        uses: actions/checkout@v6
        with:
          repository: codeflash-ai/codeflash-agent
          path: agent
          token: ${{ secrets.CF_AGENT_REPO_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Configure git identity
        run: |
          git config --global user.name "codeflash-agent[bot]"
          git config --global user.email "codeflash-agent[bot]@users.noreply.github.com"

      - name: Install agent dependencies
        working-directory: agent
        run: uv sync

      - name: Run codeflash-agent optimize
        working-directory: agent
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: us-east-1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run codeflash-agent optimize ${{ github.workspace }}/target
